<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
		<link rel="manifest" href="./manifest.json">
    
    <style>
        :root {
            /* Nouveau fond Bleu - Violet */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #4c1d95 100%);
            
            /* Tâches plus sombres/discrètes */
            --card-bg: rgba(0, 0, 0, 0.2); 
            --card-border: rgba(255, 255, 255, 0.08);
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* Gradients d'activation */
            --task1-grad: linear-gradient(135deg, #43cea2, #185a9d);
            --task2-grad: linear-gradient(135deg, #4facfe, #00f2fe);
            --task3-grad: linear-gradient(135deg, #fa709a, #fee140);
            --task4-grad: linear-gradient(135deg, #a18cd1, #fbc2eb);
            --task5-grad: linear-gradient(135deg, #ff9a9e, #fecfef);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed; /* Le fond reste fixe au scroll */
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }
        
        .date-subtitle {
            font-size: 14px;
            color: #a5b4fc;
            font-weight: 300;
            margin-bottom: 15px;
            display: block;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #a5b4fc;
            box-shadow: 0 0 10px #a5b4fc;
            transition: width 0.4s ease;
        }

        /* --- TASK LIST --- */
        .view-section {
            display: flex; /* Flex par défaut, géré par JS */
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            padding-bottom: 100px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        .task {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .task:active { transform: scale(0.97); }

        .task .emoji {
            font-size: 22px;
            margin-right: 15px;
            opacity: 0.5; /* Emoji plus sombre */
            filter: grayscale(100%);
            transition: all 0.3s;
        }

        .task-text {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-muted); /* Texte plus sombre */
            transition: color 0.3s;
            flex-grow: 1;
        }

        .check-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .check-icon::after {
            content: '✓';
            color: white;
            font-size: 12px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }

        /* --- COMPLETED STATE --- */
        .task.completed {
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }
        
        /* Quand complété, on éclaire tout */
        .task.completed .emoji { opacity: 1; filter: grayscale(0%); transform: scale(1.2); }
        .task.completed .task-text { color: white; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .task.completed .check-icon { border-color: transparent; background: rgba(255,255,255,0.25); }
        .task.completed .check-icon::after { opacity: 1; transform: scale(1); }

        #task1.completed { background: var(--task1-grad); }
        #task2.completed { background: var(--task2-grad); }
        #task3.completed { background: var(--task3-grad); }
        #task4.completed { background: var(--task4-grad); }
        #task5.completed { background: var(--task5-grad); }

        /* --- CALENDAR VIEW --- */
        .card-glass {
            background: rgba(20, 20, 40, 0.6);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(15px);
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .nav-header h2 { margin: 0; font-size: 18px; text-transform: capitalize; }
        
        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .weekday { text-align: center; font-size: 11px; color: #6366f1; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;}

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 14px;
            position: relative;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .day.has-data { border: 1px solid rgba(255,255,255,0.1); }
        
        .day.perfect { background: #10b981; color: white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); border: none; }
        .day.imperfect { border: 1px solid #f43f5e; color: #f43f5e; }
        .day.future { opacity: 0.2; pointer-events: none; }
        
        .day.today-marker { border: 2px solid #a5b4fc; font-weight: bold; }

        /* --- STATS VIEW --- */
        .stats-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#4f46e5 var(--percent), rgba(255,255,255,0.05) 0deg);
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.3);
            transition: --percent 1s ease;
        }

        .stats-inner {
            width: 170px;
            height: 170px;
            background: #111; /* Fond sombre intérieur */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .stats-number { font-size: 42px; font-weight: 800; background: linear-gradient(to right, #fff, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .stats-label { font-size: 12px; color: #94a3b8; margin-top: 5px; text-transform: uppercase;}

        .win-message {
            text-align: center;
            margin-top: 20px;
            color: #fbbf24;
            font-weight: 700;
            font-size: 18px;
            min-height: 27px;
        }

        /* --- NAVIGATION --- */
        .nav-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .bubble {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(30, 27, 75, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #a5b4fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bubble.active {
            background: #4f46e5;
            color: white;
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.5);
            border: none;
        }

    </style>
</head>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('Service Worker enregistré avec succès:', registration.scope);
        })
        .catch(error => {
          console.error('Échec de l\'enregistrement du Service Worker:', error);
        });
    });
  }
</script>

<body>

    <header id="main-header">
        <h1 id="header-title">Bonjour</h1>
        <span id="header-date" class="date-subtitle">29 Janvier</span>
        <div class="progress-container">
            <div id="daily-progress" class="progress-bar"></div>
        </div>
    </header>

    <div id="view-tasks" class="view-section">
        <div id="task1" class="task" onclick="toggleTask(this)"><span class="emoji">📖</span> <span class="task-text">Lire 1 page</span><div class="check-icon"></div></div>
        <div id="task2" class="task" onclick="toggleTask(this)"><span class="emoji">💪</span> <span class="task-text">Faire 5 pompes</span><div class="check-icon"></div></div>
        <div id="task3" class="task" onclick="toggleTask(this)"><span class="emoji">👶</span> <span class="task-text">Jouer 1 minute</span><div class="check-icon"></div></div>
        <div id="task4" class="task" onclick="toggleTask(this)"><span class="emoji">📿</span> <span class="task-text">1 dizaine de chapelet</span><div class="check-icon"></div></div>
        <div id="task5" class="task" onclick="toggleTask(this)"><span class="emoji">🧹</span> <span class="task-text">Nettoyer qqchose</span><div class="check-icon"></div></div>
    </div>

    <div id="view-calendar" class="view-section hidden">
        <div class="card-glass">
            <div class="nav-header">
                <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                <h2 id="cal-month-year"></h2>
                <button class="nav-btn" onclick="changeMonth(1)">❯</button>
            </div>
            <div class="calendar-grid">
                <div class="weekday">D</div><div class="weekday">L</div><div class="weekday">M</div>
                <div class="weekday">M</div><div class="weekday">J</div><div class="weekday">V</div><div class="weekday">S</div>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </div>
        <p style="text-align:center; font-size:12px; opacity:0.6; margin-top:20px;">Clique sur un jour pour voir ou modifier ses tâches.</p>
    </div>

    <div id="view-stats" class="view-section hidden">
        <div class="card-glass">
            <div class="nav-header">
                <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                <h2 id="stats-month-year"></h2>
                <button class="nav-btn" onclick="changeMonth(1)">❯</button>
            </div>
            
            <div class="stats-circle" id="stats-pie">
                <div class="stats-inner">
                    <span class="stats-number" id="stats-percent">0%</span>
                    <span class="stats-label">Réussite</span>
                </div>
            </div>
            
            <div id="win-message" class="win-message"></div>
        </div>
    </div>

    <div class="nav-dock">
        <div class="bubble" id="btn-calendar" onclick="switchView('calendar')">📅</div>
        <div class="bubble active" id="btn-home" onclick="goHome()">⚡</div>
        <div class="bubble" id="btn-stats" onclick="switchView('stats')">📊</div>
    </div>

    <script>
        const tasks = ['task1', 'task2', 'task3', 'task4', 'task5'];
        
        let today = new Date(); // La "vraie" date d'aujourd'hui
        let selectedDate = new Date(); // La date qu'on regarde (peut être hier, demain...)
        let viewDate = new Date(); // Le mois qu'on regarde sur le calendrier/stats

        // --- CORE FUNCTIONS ---

        function getDateKey(date) {
            return `tasks-${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        // Chargement des tâches pour la date SÉLECTIONNÉE
        function loadTasksForSelectedDate() {
            const key = getDateKey(selectedDate);
            const saved = JSON.parse(localStorage.getItem(key)) || {};
            
            tasks.forEach(task => {
                const el = document.getElementById(task);
                el.classList.remove('completed');
                el.id = task; // Garder l'ID pour le style CSS
                if (saved[task]) el.classList.add('completed');
            });

            updateHeader();
        }

        function saveTask(taskId, completed) {
            const key = getDateKey(selectedDate);
            const saved = JSON.parse(localStorage.getItem(key)) || {};
            saved[taskId] = completed;
            localStorage.setItem(key, JSON.stringify(saved));
            updateHeader(); // Met à jour la progress bar
        }

        function toggleTask(el) {
            el.classList.toggle('completed');
            if(navigator.vibrate) navigator.vibrate(40); // Petit retour haptique
            saveTask(el.id, el.classList.contains('completed'));
        }

        // Met à jour l'entête (Titre + Barre de progression)
        function updateHeader() {
            const key = getDateKey(selectedDate);
            const saved = JSON.parse(localStorage.getItem(key)) || {};
            const count = tasks.filter(t => saved[t]).length;
            const percent = (count / tasks.length) * 100;

            document.getElementById('daily-progress').style.width = percent + '%';

            // Gestion des titres
            const titleEl = document.getElementById('header-title');
            const dateEl = document.getElementById('header-date');
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            dateEl.textContent = selectedDate.toLocaleDateString('fr-FR', options);

            // Comparaison de dates (sans les heures)
            const isToday = selectedDate.setHours(0,0,0,0) === today.setHours(0,0,0,0);
            
            if (isToday) {
                titleEl.textContent = percent === 100 ? "Excellent ! 🎉" : "Aujourd'hui";
            } else {
                titleEl.textContent = percent === 100 ? "Jour Complété ✅" : "Historique";
            }
        }

        // --- NAVIGATION LOGIC ---

        function switchView(viewName) {
            // Cacher tout
            document.getElementById('view-tasks').classList.add('hidden');
            document.getElementById('view-calendar').classList.add('hidden');
            document.getElementById('view-stats').classList.add('hidden');
            
            // Gestion des boutons actifs
            document.getElementById('btn-home').classList.remove('active');
            document.getElementById('btn-calendar').classList.remove('active');
            document.getElementById('btn-stats').classList.remove('active');

            // Header visible seulement sur les tâches
            const header = document.getElementById('main-header');
            
            if (viewName === 'tasks') {
                document.getElementById('view-tasks').classList.remove('hidden');
                document.getElementById('btn-home').classList.add('active');
                header.style.opacity = '1';
                header.style.visibility = 'visible';
                loadTasksForSelectedDate();
            } 
            else if (viewName === 'calendar') {
                document.getElementById('view-calendar').classList.remove('hidden');
                document.getElementById('btn-calendar').classList.add('active');
                header.style.opacity = '0'; // On cache le header proprement
                header.style.visibility = 'hidden';
                renderCalendar();
            }
            else if (viewName === 'stats') {
                document.getElementById('view-stats').classList.remove('hidden');
                document.getElementById('btn-stats').classList.add('active');
                header.style.opacity = '0';
                header.style.visibility = 'hidden';
                renderStats();
            }
        }

        function goHome() {
            selectedDate = new Date(); // Reviens à aujourd'hui
            switchView('tasks');
        }

        function changeMonth(delta) {
            viewDate.setMonth(viewDate.getMonth() + delta);
            // Rafraichir la vue active
            if (!document.getElementById('view-calendar').classList.contains('hidden')) renderCalendar();
            if (!document.getElementById('view-stats').classList.contains('hidden')) renderStats();
        }

        // --- CALENDAR RENDER ---

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            
            document.getElementById('cal-month-year').textContent = viewDate.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Espaces vides
            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= daysInMonth; d++) {
                const dayEl = document.createElement('div');
                dayEl.classList.add('day');
                dayEl.textContent = d;
                
                const checkDate = new Date(year, month, d);
                const isFuture = checkDate > new Date().setHours(0,0,0,0);
                
                // Vérifier completion
                const key = getDateKey(checkDate);
                const saved = JSON.parse(localStorage.getItem(key));
                
                if (checkDate.toDateString() === new Date().toDateString()) {
                    dayEl.classList.add('today-marker');
                }

                if (isFuture) {
                    dayEl.classList.add('future');
                } else if (saved) {
                    const doneCount = tasks.filter(t => saved[t]).length;
                    dayEl.classList.add('has-data');
                    if (doneCount === tasks.length) {
                        dayEl.classList.add('perfect');
                        dayEl.textContent = '✓';
                    } else if (doneCount > 0) {
                        dayEl.classList.add('imperfect');
                    }
                }

                // Interaction : Click pour aller voir ce jour
                dayEl.onclick = () => {
                    if (isFuture) return;
                    selectedDate = new Date(year, month, d);
                    switchView('tasks');
                };

                grid.appendChild(dayEl);
            }
        }

        // --- STATS RENDER ---

				function renderStats() {
						const year = viewDate.getFullYear();
						const month = viewDate.getMonth();
						document.getElementById('stats-month-year').textContent = viewDate.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

						const daysInMonth = new Date(year, month + 1, 0).getDate();
						let totalPerfectDays = 0;
						let daysElapsedSoFar = 0;

						const todayTime = new Date().setHours(0,0,0,0);

						for (let d = 1; d <= daysInMonth; d++) {
								const dateToCheck = new Date(year, month, d);
								const key = getDateKey(dateToCheck);
								const saved = JSON.parse(localStorage.getItem(key)) || {};
								const isPerfect = tasks.length > 0 && tasks.every(t => saved[t]);
								
								if (isPerfect) totalPerfectDays++;
								if (dateToCheck <= todayTime) daysElapsedSoFar++;
						}

						// 1. Progression réelle du mois (ex: 1/31 = 3%)
						let monthCompletionPercent = Math.round((totalPerfectDays / daysInMonth) * 100);
						
						// 2. Régularité sur les jours passés
						let consistencyPercent = daysElapsedSoFar > 0 ? Math.round((totalPerfectDays / daysElapsedSoFar) * 100) : 0;

						// --- LOGIQUE DE COULEUR DYNAMIQUE ---
						let statsColor = "#4f46e5"; // Indigo par défaut
						if (consistencyPercent >= 90) {
								statsColor = "#10b981"; // Vert émeraude (Excellent)
						} else if (consistencyPercent >= 70) {
								statsColor = "#3b82f6"; // Bleu (Bon)
						} else if (consistencyPercent >= 50) {
								statsColor = "#f59e0b"; // Orange (Attention)
						} else if (daysElapsedSoFar > 0) {
								statsColor = "#ef4444"; // Rouge (Discipline à revoir)
						}

						// Application du style au cercle et à l'ombre
						const pie = document.getElementById('stats-pie');
						pie.style.background = `conic-gradient(${statsColor} ${monthCompletionPercent}%, rgba(255,255,255,0.05) 0deg)`;
						pie.style.boxShadow = `0 0 30px ${statsColor}44`; // 44 ajoute de la transparence à l'ombre
						
						// Affichage du score principal
						document.getElementById('stats-percent').textContent = `${monthCompletionPercent}%`;
						document.getElementById('stats-percent').style.background = `linear-gradient(to right, #fff, ${statsColor})`;
						document.getElementById('stats-percent').style.webkitBackgroundClip = "text";

						// Message de statut
						const msgEl = document.getElementById('win-message');
						if (monthCompletionPercent === 100) {
								msgEl.style.color = "#fbbf24";
								msgEl.innerHTML = "🏆 MOIS PARFAIT ! INCROYABLE ! 🏆";
						} else {
								msgEl.style.color = statsColor;
								msgEl.innerHTML = `Régularité : ${consistencyPercent}%<br><span style="font-size:12px; opacity:0.7; color:#94a3b8">${totalPerfectDays} / ${daysInMonth} jours complétés</span>`;
						}
				}

        // Init
        loadTasksForSelectedDate();

    </script>
</body>
</html>
